# Copy this file to `secrets.yaml` (which is gitignored) and fill in
# real values before flashing any of the example configs.

wifi_ssid: "your-wifi-ssid"
wifi_password: "your-wifi-password"

# 32-byte base64 noise key shared with Home Assistant.
# Generate with:  openssl rand -base64 32
api_key: "REPLACE_WITH_BASE64_KEY"

# OTA password — any non-empty string. ESPHome warns if missing.
ota_password: "REPLACE_WITH_RANDOM_STRING"
